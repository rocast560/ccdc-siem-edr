[package]
name = "proxy_dll"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_System_LibraryLoader"]

# Build (cross from Linux):  cargo zigbuild --release --target x86_64-pc-windows-gnu
# Rename the output to match the host binary's import: version.dll / mpclient.dll / mpsvc.dll
# Export list: run `dumpbin /exports` (or `objdump -p`) on the GENUINE DLL and add one
# fwd! line per exported function the host binds.
